<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>curveball.fun — a fairer way to find the next curveball</title>
    <meta
      name="description"
      content="Launch a token on a transparent bonding curve on RISE. No presale or private allocation. V1 markets can graduate into a mock pool while venue integration is tested."
    />
    <script type="module" src="https://ascii.rest/ascii.js"></script>
    <script>
      (() => {
        let theme = "light";
        try {
          const stored = localStorage.getItem("curveball-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/src.tsx"></script>
  </body>
</html>
