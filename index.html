    <script>
      (() => {
        let theme = "light";
        try {
          const stored = localStorage.getItem("curveball-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
