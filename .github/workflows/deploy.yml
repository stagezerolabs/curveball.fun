name: Deploy to Netlify

# Deploy keys are disabled on this org, so Netlify cannot pull the repo itself.
# This builds here and pushes the result to Netlify instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # Demo data ships until the contracts are deployed, so the site is
      # presentable with an empty database. Remove to strip it from the bundle.
      - run: bun run build
        env:
          VITE_DEMO_DATA: "true"

      - name: Publish to Netlify
        # dist/ is already built by the step above; this only uploads it.
        run: bunx netlify-cli@17 deploy --prod --dir=dist --message "$GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 98c3e594-e664-4fc9-b8c2-e3b0e876d003
