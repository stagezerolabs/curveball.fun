schema: 1
name: curveball-security
version: "0.3.0"
description: >
  Security review toolkit for the Curveball launchpad (RISE). Covers the Solidity
  singletons, the off-chain social service, the indexer's reorg path, the keeper, the
  Vercel artwork API, and the deployment/ops surface. Encodes the trust model from ADR 0003
  so findings can be judged against stated intent rather than generic best practice, and
  bundles Postgres reorg/cross-check harnesses for reproducing chain-divergence bugs.

author:
  name: curveball
  url: https://curveball.fun

license: MIT

skills:
  - skills/curveball-threat-model/
  - skills/launchpad-solidity-review/
  - skills/offchain-service-review/

dependencies:
  scripts:
    - scripts/setup.sh

checks:
  - name: forge-available
    command: forge --version
  - name: node-available
    command: node --version
