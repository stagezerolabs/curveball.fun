[build]
  publish = "dist"
  command = "bun run build"

# Testnet/hosted site configuration: routes the site's /api/* calls to the
# deployed Koyeb API. Apply this variant with `netlify deploy --config
# netlify.testnet.toml` (or set it as the site's config file in the Netlify UI).
# The default netlify.toml intentionally carries no API redirect.
[[redirects]]
  from = "/api/*"
  to = "https://curveball-kamicash-7a463851.koyeb.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
