name: curveball-npm

services:
  proxy-manager:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: curveball-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    environment:
      TZ: Etc/UTC
      IP_RANGES_FETCH_ENABLED: "false"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks: [proxy]
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  proxy:
    external: true
    name: proxy

volumes:
  npm_data:
  npm_letsencrypt:
