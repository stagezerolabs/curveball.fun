limit_req_zone $binary_remote_addr zone=rns_lookup_limit:10m rate=120r/m;

server {
    listen 8788;
    server_name _;

    set_real_ip_from ${CURVEBALL_TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /v1/events {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Curveball-Client-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ^~ /v1/rns/primary/ {
        limit_req zone=rns_lookup_limit burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Curveball-Client-IP $remote_addr;
    }

    location / {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Curveball-Client-IP $remote_addr;
    }
}
