[build]
  publish = "dist"
  command = "bun run build"

# Local-first release: no default API redirect or chain-specific wallet config.
# The existing testnet site stays on its current deployed revision. Its explicit
# configuration is retained in netlify.testnet.toml for a later approved update.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
