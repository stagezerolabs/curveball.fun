[build]
  publish = "dist"
  # Explicit, even though CI builds before publishing. Without a command the
  # Netlify CLI runs framework detection, which is ambiguous in this repo
  # (the contracts workspace matches several framework signatures) and fails.
  command = "bun run build"

[build.environment]
  VITE_CHAIN_ID = "4153"
  VITE_RPC_URL = "https://rpc.risechain.com/"
  VITE_LAUNCHPAD_ADDRESS = "0x1A34768eAb2F6b925D25ca1d6daC03C1a25Ad39E"

[[redirects]]
  from = "/api/*"
  to = "https://curveball-kamicash-7a463851.koyeb.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
