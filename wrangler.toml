name = "curveball"
main = "src/worker.ts"
compatibility_date = "2024-09-29"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive for Neon Postgres connection
[[hyperdrive]]
binding = "DB"
id = "your-hyperdrive-id-here"  # Will be set after creating Hyperdrive config

# Cron trigger for the indexer
[triggers]
crons = ["*/5 * * * *"]  # Every 5 minutes

# Workers Static Assets for frontend
[assets]
directory = "./dist"
binding = "ASSETS"

# Environment variables
[vars]
EXPECTED_CHAIN_ID = "11155931"
