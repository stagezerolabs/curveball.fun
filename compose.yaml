services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: curveball
      POSTGRES_PASSWORD: curveball
      POSTGRES_USER: curveball
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curveball -d curveball"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_mainnet:
    profiles: ["mainnet"]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: curveball_mainnet
      POSTGRES_PASSWORD: curveball
      POSTGRES_USER: curveball
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curveball -d curveball_mainnet"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_mainnet_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://curveball:curveball@postgres:5432/curveball
      MAINNET_DATABASE_URL: postgresql://curveball:curveball@postgres_mainnet:5432/curveball_mainnet
      LAUNCHPAD_ADDRESS: ${DOCKER_LAUNCHPAD_ADDRESS:-}
      EXPECTED_CHAIN_ID: ${DOCKER_EXPECTED_CHAIN_ID:-31337}
      INDEXER_START_BLOCK: ${DOCKER_INDEXER_START_BLOCK:-0}
      PORT: 3001
      RPC_URL: ${DOCKER_RPC_URL:-http://host.docker.internal:8545}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DOCKER_APP_PORT:-3001}:3001"

  indexer:
    build:
      context: .
    command: ["bun", "run", "indexer"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://curveball:curveball@postgres:5432/curveball
      MAINNET_DATABASE_URL: postgresql://curveball:curveball@postgres_mainnet:5432/curveball_mainnet
      LAUNCHPAD_ADDRESS: ${DOCKER_LAUNCHPAD_ADDRESS:-}
      EXPECTED_CHAIN_ID: ${DOCKER_EXPECTED_CHAIN_ID:-31337}
      INDEXER_START_BLOCK: ${DOCKER_INDEXER_START_BLOCK:-0}
      RPC_URL: ${DOCKER_RPC_URL:-http://host.docker.internal:8545}
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  postgres_data:
  postgres_mainnet_data:
